version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agriroute_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./agriroute.db
      - OSRM_BASE_URL=https://router.project-osrm.org
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: agriroute_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    container_name: agriroute_postgres
    environment:
      POSTGRES_USER: agriroute
      POSTGRES_PASSWORD: agriroute_secret_password
      POSTGRES_DB: agriroute_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
